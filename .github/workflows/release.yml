# Release (PLAN §11, §15 M6).
#
# Push a tag like `v0.1.0` and this builds the installers on their own native
# runners and attaches them to a **draft** GitHub release. Nothing reaches
# users until a human opens that draft and clicks publish.
#
# Native runners rather than cross-compilation, because both `better-sqlite3`
# and `@murmur/native` are compiled per platform — there is no honest way to
# produce a Windows build from a Mac.
#
# Linux joined the matrix with the X11 backend: `@murmur/native` now builds on
# all three, so a Linux artifact is a UI that can actually dictate. It ships
# from ubuntu-24.04 rather than ubuntu-latest — see the comment on that entry
# for why the runner version is the oldest glibc it can run on.
#
# The build jobs do **not** publish. They upload artifacts, and one final job
# assembles the release. Letting each platform publish for itself produced
# duplicate drafts for the same tag: electron-builder does a non-atomic
# "find the draft for this tag, else create one", so two jobs running in
# parallel both find nothing and both create. Re-running a tag compounded it.
# One publisher, running once, cannot race itself.

name: Release

on:
  push:
    tags: ['v*']
  # Lets you rehearse the whole thing without cutting a tag. The draft it
  # produces is named for the last tag, so delete it afterwards.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Generous: a cold cache builds whisper.cpp and llama.cpp universal from
    # source, which dominates everything else in this job.
    timeout-minutes: 120
    strategy:
      # One platform failing must not bin the other's artifacts.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (arm64 + x64 DMG)
            script: pack:mac
          - os: windows-latest
            name: Windows (NSIS x64)
            script: pack:win
          # Pinned to a version rather than ubuntu-latest, and only here. A
          # Linux binary links the glibc it was built against and will not start
          # on anything older, so this line is what sets the oldest distro the
          # AppImage and .deb can run on. `ubuntu-latest` would move that floor
          # silently under us the day GitHub repoints the label; naming the
          # version makes it a decision. The other two jobs have no equivalent
          # concern.
          #
          # 24.04 means glibc 2.39: Ubuntu 24.04+, Debian 13+, Fedora 40+.
          # Ubuntu 22.04 LTS (glibc 2.35) is deliberately out of scope — it was
          # the previous pin, dropped because the 22.04 runner image begins
          # deprecation on 2026-09-17 and brownouts fail jobs during the window.
          # If older distros need supporting again, the fix is to build inside
          # an older-base container on a supported runner, not to re-pin to a
          # retiring image.
          - os: ubuntu-24.04
            name: Linux (AppImage + deb x64)
            script: pack:linux

    steps:
      # The repo is LF; stop the Windows runner's autocrlf from rewriting it.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The X11 client headers the Linux backend links against — not on the
      # runner image by default. Installed before `npm ci` so the addon builds
      # on the first pass rather than only on the explicit build below.
      - name: Install the X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev

      - name: Install
        run: npm ci

      # npm treats @murmur/native as optional, so a broken compile during
      # `npm ci` is skipped silently. Build it explicitly: shipping an
      # installer whose addon quietly failed to compile would produce an app
      # that launches and cannot dictate.
      - name: Build the native module
        run: npm run native:build

      # `available` is a boolean property, not a method — the stub sets it to
      # false and reports why through platformInfo().
      #
      # Two assertions, because they mean different things on different
      # runners. "platformInfo does not start with `stub`" is the universal
      # one: it fails only when the addon did not compile or did not load,
      # which is the shipping risk this step exists for. `available` is only
      # additionally required on macOS and Windows — the Linux backend
      # correctly answers false on a headless runner (no X server to connect
      # to), so asserting it there would fail every release for the one reason
      # that is not a defect.
      - name: Verify the native module loads
        shell: bash
        run: |
          node -e "
            const n = require('@murmur/native')
            const info = n.platformInfo()
            if (info.startsWith('stub')) {
              console.error('native module failed to load:', info)
              process.exit(1)
            }
            if (process.platform !== 'linux' && !n.available) {
              console.error('native module loaded but reports unavailable:', info)
              process.exit(1)
            }
            console.log('native ok:', info)
          "

      # The same gate as CI. A release should never be the first time these run
      # against the tagged commit.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Sidecars are bundled into the installer (electron-builder.yml
      # extraResources). Cached on the pinned upstream tags, which live inside
      # these scripts — so a pin bump invalidates the cache and nothing else
      # does. Building whisper.cpp and llama.cpp universal from source is by
      # far the slowest part of a release; the Windows side downloads official
      # prebuilds instead and takes seconds.
      - name: Cache sidecar binaries
        id: sidecars
        uses: actions/cache@v4
        with:
          path: .sidecars/bin
          key: sidecars-${{ runner.os }}-${{ hashFiles('scripts/sidecars/build-*.sh', 'scripts/sidecars/fetch-*.ps1') }}

      - name: Build sidecars (macOS)
        if: runner.os == 'macOS' && steps.sidecars.outputs.cache-hit != 'true'
        run: |
          brew install cmake || true
          scripts/sidecars/build-whisper.sh
          scripts/sidecars/build-llama.sh

      - name: Fetch sidecars (Windows)
        if: runner.os == 'Windows' && steps.sidecars.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/sidecars/fetch-whisper-win.ps1
          ./scripts/sidecars/fetch-llama-win.ps1

      # From source, like macOS: ggml-org publishes no Linux prebuild we could
      # pin the way fetch-*-win.ps1 does. Slow, and the cache above is what
      # keeps it off the critical path for every release but the first.
      - name: Build sidecars (Linux)
        if: runner.os == 'Linux' && steps.sidecars.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential
          scripts/sidecars/build-linux.sh

      # A release that silently ships without them is the bug this whole step
      # exists to prevent: the app installs, opens, downloads a model, and then
      # cannot transcribe a word.
      - name: Verify the sidecars are present
        shell: bash
        run: |
          ls -la .sidecars/bin
          for name in whisper-server llama-server; do
            if [ ! -e ".sidecars/bin/$name" ] && [ ! -e ".sidecars/bin/$name.exe" ]; then
              echo "::error::$name is missing from .sidecars/bin — the installer would ship unable to transcribe"
              exit 1
            fi
          done

      # Signing turns itself on when the secrets exist — no code change needed
      # the day they are added, and no failed build on the day they are not.
      #
      #   CSC_LINK             base64 of the Developer ID .p12
      #   CSC_KEY_PASSWORD     its export password
      #
      # and, for notarisation, either
      #   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER   (preferred:
      #     scoped and revocable on its own, rather than tied to an Apple ID)
      #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
      #
      # electron-builder reads all of these from the environment, and
      # `hardenedRuntime` plus the entitlements are already declared in
      # electron-builder.yml.
      #
      # Both matter, and for different things. Signing is what lets macOS
      # replace the app during an update and what makes TCC keep a permission
      # grant across versions; notarisation is what stops Gatekeeper calling a
      # download damaged. Both secrets are configured, so this is the path a
      # real release takes — the fallback below stays only so a fork or a
      # secretless re-run still produces an installer instead of failing.
      # `pack:*`, not `release:*` — these scripts pass `--publish never`. The
      # release job below is the only thing that talks to GitHub.
      # @electron/notarize wants APPLE_API_KEY to be a *path to the .p8 file*,
      # not its contents — a secret passed straight through would be read as a
      # filename and fail. So the key travels as base64 and is written to disk
      # here. The runner is ephemeral, but 0600 anyway: it is a credential that
      # can notarise software as this team.
      - name: Materialise the notarisation key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "No notarisation key configured — this build will be signed but not notarised."
            exit 0
          fi
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build the installers
        run: npm run ${{ matrix.script }} --workspace @murmur/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Auto-discovery must be off when there is no certificate, or
          # electron-builder hunts a keychain the runner does not have. This
          # expression is the switch: it reads "true" once CSC_LINK is set.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # APPLE_API_KEY is deliberately absent here — the step above puts the
          # file path into GITHUB_ENV, and naming it again would override it.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Same reasoning as the sidecar check further up, for the other binary a
      # release can silently ship without — and checked inside the built bundle
      # rather than in the source tree, so it proves the whole chain: compiled,
      # copied in by extraResources, and signed.
      #
      # The failure this prevents is invisible in use. Without the helper the
      # app still records the meeting and still transcribes it; there is simply
      # nobody in the transcript but the user. A release that does that is worse
      # than one that fails to build.
      - name: Verify the system-audio helper shipped (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          failed=0
          for slice in mac-arm64 mac; do
            APP="apps/desktop/release/$slice/Murmur.app"
            [ -d "$APP" ] || continue
            TAP="$APP/Contents/Resources/macos-audio-tap"
            if [ ! -x "$TAP" ]; then
              echo "::error::$slice ships without the system-audio helper — meetings would record only the user's own voice"
              failed=1
              continue
            fi
            echo "$slice: $(lipo -archs "$TAP")"
            # Unsigned, the tap is created successfully and then delivers pure
            # silence — the one failure mode that cannot report itself.
            codesign -dv "$TAP" 2>&1 | grep -q "Authority=Developer ID" \
              && echo "$slice: helper is signed" \
              || echo "::warning::$slice helper is unsigned; system audio will return silence"
          done
          exit $failed

      # Says plainly which kind of build this is, so a signed release is never
      # assumed from a run that quietly produced an unsigned one.
      - name: Report the signing state (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="apps/desktop/release/mac-arm64/Murmur.app"
          [ -d "$APP" ] || APP="apps/desktop/release/mac/Murmur.app"
          if [ -d "$APP" ]; then
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
          fi

      - name: Upload the installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # The single publisher. Runs once, after every platform, so there is exactly
  # one draft per tag no matter how many times the tag is re-cut.
  release:
    name: Draft release
    needs: build
    # Only for a tag: a workflow_dispatch rehearsal builds and uploads
    # artifacts, but must not invent a release for whatever tag came last.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Show what will be attached
        run: ls -la installers

      - name: Replace any existing draft for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Deleting first makes a re-run idempotent: one draft, always, rather
          # than a second one accumulating beside the first. `|| true` because
          # the usual case is that no release exists yet. The tag itself is
          # left alone — only the release object goes.
          gh release delete "$TAG" --yes || true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "${TAG#v}" \
            --notes 'Speech and polishing servers are bundled, so a fresh install can transcribe once you download a model from the Hub.

          **macOS** is signed with a Developer ID and notarised, so it opens normally.

          **Windows is not signed.** SmartScreen will warn: More info → Run anyway. Murmur asks to watch your keyboard and type into other applications, so only accept that if you trust this build — building from source sidesteps it.

          **Linux** needs an X11 session (not Wayland) and glibc 2.39+ — Ubuntu 24.04+, Debian 13+, Fedora 40+.' \
            installers/*

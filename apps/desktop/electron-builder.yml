# Packaging skeleton (PLAN §11, §15).
#
# Exercised in CI on macOS runners, not here — signing identities, notarisation
# credentials and the universal sidecar binaries all arrive with the release
# pipeline. What is fixed now is the shape: a signed, hardened, notarised DMG
# with the microphone entitlement, distributed directly rather than via the
# App Store (the event tap and Accessibility APIs are sandbox-incompatible).

appId: com.murmur.app
productName: Murmur
copyright: Copyright © 2026 Murmur

directories:
  buildResources: buildResources
  output: release

files:
  - out/**
  - package.json
  # npm workspaces hoist to the repo root, so the production dependency walk
  # needs verifying on a macOS runner before the first real DMG.
  - node_modules/**
  - '!**/*.map'

# The model catalog ships as data next to the app so it can be refreshed
# without a rebuild (PLAN §8). Model weights are never bundled — they are
# downloaded by the user, checksum-verified, into Application Support.
extraResources:
  - from: ../../resources/catalog
    to: catalog
    filter: ['**/*.json']
  # The speech and polishing servers, landing in `Contents/Resources/bin` —
  # exactly where `sidecarSearchPaths()` looks first in a packaged app.
  #
  # Without this a downloaded build can never transcribe. The Hub can fetch the
  # *weights*, but the servers that run them were only ever built into the dev
  # repo's `.sidecars/bin`, so an installed app searched two paths inside its
  # own bundle, found nothing, and told the user to run a build script that
  # does not ship with it.
  #
  # The directory is created (empty if need be) by the pack scripts, because
  # electron-builder treats a missing `from` as fatal and a developer who has
  # not built the sidecars must still be able to package the app.
  - from: ../../.sidecars/bin
    to: bin
    filter:
      - whisper-server
      - llama-server
      - whisper-server.exe
      - llama-server.exe
      - '*.dll'
  # The system-audio tap helper for meeting capture (PLAN §18.2), landing in
  # `Contents/Resources/macos-audio-tap`. Built by
  # scripts/sidecars/build-audio-tap.sh; absent on non-macOS builds, where
  # meetings fall back to microphone-only.
  - from: resources
    to: .
    filter: ['macos-audio-tap']

asar: true
# The compiled N-API addon must stay outside the archive to be dlopen-able.
asarUnpack:
  - '**/*.node'
  - node_modules/@murmur/native/**

mac:
  # Regenerated from buildResources/icon.svg by scripts/make-icons.sh.
  icon: buildResources/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # macOS 13 Ventura+ (PLAN §16.1).
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Murmur listens only while you hold your dictation key. Audio is transcribed
      on this Mac and never leaves it.
    # Meeting capture (PLAN §18.2). macOS 14.2+ treats system audio as its own
    # consent, separate from screen recording — which is the whole reason a
    # CoreAudio process tap is used instead of ScreenCaptureKit: no purple
    # recording indicator, no "your screen is being observed", no screen access
    # requested or granted. Without this key the OS cannot present the prompt
    # at all and the tap silently yields digital silence.
    NSAudioCaptureUsageDescription: >-
      Murmur records the other participants in a call so it can transcribe the
      meeting. It captures audio only, never your screen, and only while you
      have asked it to record.
    # Menu-bar app: no Dock icon by default (PLAN §2.3).
    LSUIElement: true

dmg:
  title: ${productName}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# Windows: NSIS installer, x64. Not signed yet — see the note under `mac`
# above; the same Authenticode gap applies here and SmartScreen will warn until
# a certificate is configured.
win:
  # Regenerated from buildResources/icon.svg by scripts/make-icons.sh.
  icon: buildResources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # A real installer rather than one-click: this app asks for a keyboard hook,
  # so the user should get to see and choose where it lands.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user by default so no UAC prompt is needed to install.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Linux: AppImage (runs anywhere, no install) plus a .deb for apt users. x64
# only for now — the sidecar prebuilds we fetch are x64, so an arm64 package
# would install and never transcribe.
#
# `category` and the desktop entry matter more here than on the other two: it
# is what puts Murmur in the applications menu at all.
linux:
  # The 512 px PNG scripts/make-icons.sh already emits for this target.
  icon: buildResources/icon.png
  category: Utility
  synopsis: Local-first dictation
  description: >-
    Hold a key, speak, release — polished text appears wherever your cursor is.
    Speech-to-text and polishing both run on this machine.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  desktop:
    entry:
      # Startup notification off: the first window is the tray/Bar, not a
      # document window, so the desktop's "starting…" cursor never resolves.
      StartupNotify: 'false'
      Keywords: 'dictation;speech;transcription;voice;'

# `deb.depends` is deliberately left at electron-builder's default. The default
# list already carries libxtst6 — the one package the native addon adds beyond
# Electron's own needs, and the one that supplies both XTEST and XRecord —
# while libx11-6 arrives transitively with GTK. Hand-writing the list would
# override the default wholesale and silently drop the rest of it, and the
# ALSA package has been renamed (libasound2 → libasound2t64) in a way that
# would make a pinned list wrong on current Debian and Ubuntu.

# Draft, not published: a release is created with the binaries attached and
# waits for a human to review and publish it. Nothing reaches users by accident.
# Local `pack:*` scripts pass `--publish never`; only the release workflow
# passes `--publish always`.
publish:
  provider: github
  owner: jdbremer
  repo: Murmur
  releaseType: draft
